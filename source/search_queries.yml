# Twitter search queries for stroke and cerebrovascular disease content
# Used by: fetcher.py
# Each query is passed to the Twitter search API.
# Tips:
#   - Keep each query focused on one therapeutic area
#   - "lang:en" limits to English tweets
#   - OR groups multiple synonyms
#   - Twitter search supports quoted phrases

search_queries:
  - "(stroke OR \"ischemic stroke\") (thrombolysis OR tenecteplase OR TNK OR alteplase OR tPA)"
  - "(stroke OR LVO OR MeVO) (thrombectomy OR EVT OR endovascular OR \"stent retriever\" OR aspiration)"
  - "(stroke OR TIA) (antiplatelet OR DAPT OR clopidogrel OR ticagrelor OR aspirin OR cilostazol)"
  - "(stroke OR \"atrial fibrillation\") (DOAC OR apixaban OR rivaroxaban OR \"factor XIa\" OR asundexian OR milvexian)"
  - "(\"intracerebral hemorrhage\" OR ICH OR \"hemorrhagic stroke\" OR SAH) (andexanet OR ENRICH OR ANNEXA OR INTERACT)"
  - "(stroke) (ANGEL-ASPECT OR SELECT2 OR TENSION OR LASTE OR DISTAL OR ESCAPE-MeVO OR OCEANIC-STROKE)"
  - "(\"carotid stenosis\" OR ICAD OR moyamoya) (CEA OR stenting OR TCAR OR stroke)"
  - "(\"small vessel disease\" OR CSVD OR CADASIL OR \"cerebral venous thrombosis\" OR CVT) (stroke OR brain)"
  - "(#Stroke OR #ISC26 OR #ESOC OR #SVIN) (trial OR data OR abstract OR FDA OR guideline OR mRS OR NIHSS)"
  - "(\"acute ischemic stroke\" OR \"large vessel occlusion\") lang:en"
  - "(\"cerebrovascular\" OR \"neurointerventional\" OR \"mechanical thrombectomy\") lang:en"
