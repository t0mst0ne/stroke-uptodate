# CrossRef journal sources for Stroke & Cerebrovascular Disease
# Used by: src/crossref_fetcher.py
#
# To add a new journal: append an entry with its ISSN.
# Find ISSN at https://portal.issn.org or the journal's About page.
#
# Fields:
#   name          display name in report
#   full_name     full journal title
#   issn          print or electronic ISSN (CrossRef accepts either)
#   days_back     how many days of articles to fetch (default: 7)
#   max_items     max articles to retrieve per run (default: 30)
#   topic_filter  filter to stroke/cerebrovascular-relevant articles only (default: true)
#
# CrossRef API is free, no key required.
# Polite pool: include a mailto in User-Agent (set in crossref_fetcher.py).

crossref_email: "ppoiu87@gmail.com"   # used in User-Agent for CrossRef polite pool

journals:
  - name: Stroke
    full_name: "Stroke"
    issn: "0039-2499"
    days_back: 7
    max_items: 35
    topic_filter: false   # Stroke is already 100% stroke/cerebrovascular-specific

  - name: Lancet Neurology
    full_name: "The Lancet Neurology"
    issn: "1474-4422"
    days_back: 7
    max_items: 25
    topic_filter: true

  - name: JAMA Neurology
    full_name: "JAMA Neurology"
    issn: "2168-6149"
    days_back: 7
    max_items: 25
    topic_filter: true

  - name: Neurology
    full_name: "Neurology"
    issn: "0028-3878"
    days_back: 7
    max_items: 30
    topic_filter: true

  - name: JNNP
    full_name: "Journal of Neurology, Neurosurgery & Psychiatry"
    issn: "0022-3050"
    days_back: 7
    max_items: 25
    topic_filter: true

  - name: Int J Stroke
    full_name: "International Journal of Stroke"
    issn: "1747-4930"
    days_back: 7
    max_items: 25
    topic_filter: false

  - name: European Stroke Journal
    full_name: "European Stroke Journal"
    issn: "2396-9873"
    days_back: 7
    max_items: 25
    topic_filter: false

  - name: JNIS
    full_name: "Journal of NeuroInterventional Surgery"
    issn: "1759-8478"
    days_back: 7
    max_items: 25
    topic_filter: true

